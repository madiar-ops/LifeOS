server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Ключевая строка для SPA: React Router обрабатывает маршруты на клиенте,
    # поэтому любой неизвестный путь отдаёт index.html, а не 404.
    # Без неё прямой переход на /goals или обновление страницы ломались бы.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ассеты Vite содержат хеш в имени: их можно кэшировать надолго,
    # потому что при изменении файла меняется и имя.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html кэшировать нельзя: иначе браузер будет открывать
    # старую версию приложения после деплоя.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
