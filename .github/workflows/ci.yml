# ============================================================
# CI — три независимых набора тестов
#
# Задачи выполняются параллельно: падение фронтенда не должно
# скрывать результат по backend, и наоборот. На pull request
# видно сразу, какая часть системы сломана.
# ============================================================

name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:
    branches: [main]

jobs:
  # ---- Backend: unit + интеграционные ----------------------
  backend:
    name: Backend (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Установка .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Кэш NuGet: без него каждая сборка заново тянет пакеты.
      - name: Кэш NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: nuget-

      - name: Восстановление пакетов
        working-directory: backend
        run: dotnet restore

      - name: Сборка
        working-directory: backend
        run: dotnet build --no-restore -c Release

      # Testcontainers поднимает настоящий PostgreSQL — Docker
      # на ubuntu-latest доступен из коробки, отдельный сервис не нужен.
      - name: Тесты
        working-directory: backend
        run: dotnet test --no-build -c Release --verbosity normal

  # ---- Frontend --------------------------------------------
  frontend:
    name: Frontend (React + TypeScript)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Установка Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci, а не install: ставит строго зафиксированные версии
      # и падает при рассинхроне package.json и lock-файла.
      - name: Установка зависимостей
        working-directory: frontend
        run: npm ci

      - name: Проверка типов
        working-directory: frontend
        run: npm run typecheck

      - name: Линтер
        working-directory: frontend
        run: npm run lint

      - name: Тесты
        working-directory: frontend
        run: npx vitest run

      # Сборка в CI ловит ошибки, которые не видит dev-режим:
      # неиспользуемые импорты при strict, проблемы разделения кода.
      - name: Сборка
        working-directory: frontend
        run: npm run build

  # ---- AI-сервис -------------------------------------------
  ai-service:
    name: AI Service (FastAPI)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Установка Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Установка зависимостей
        working-directory: ai-service
        run: |
          pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      # Модели обучаются в CI заново: это одновременно проверка того,
      # что скрипты обучения не сломаны, и подготовка артефактов для тестов.
      - name: Обучение моделей
        working-directory: ai-service
        run: |
          python -m app.ml.training.generate_datasets
          python -m app.ml.training.train_finance
          python -m app.ml.training.train_health
          python -m app.ml.training.train_wellbeing_torch

      - name: Тесты
        working-directory: ai-service
        env:
          INTERNAL_API_KEY: ci-test-key
        run: pytest -v

  # ---- Проверка сборки образов -----------------------------
  docker:
    name: Docker образы
    runs-on: ubuntu-latest
    needs: [backend, ai-service]

    steps:
      - uses: actions/checkout@v4

      - name: Сборка образа backend
        run: docker build -f backend/Dockerfile -t lifeos-api:ci ./backend

      # Образ AI-сервиса обучает модели при сборке — так проверяется,
      # что финальный артефакт деплоя действительно собирается.
      - name: Сборка образа ai-service
        run: docker build -f ai-service/Dockerfile -t lifeos-ai:ci ./ai-service
